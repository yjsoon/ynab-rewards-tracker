name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare
        working-directory: apps/web
        run: pnpm build:cloudflare

      - name: Resolve Cloudflare preview domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          preview_domain="$(node -e '
            const chunks = [];
            process.stdin.on("data", (chunk) => chunks.push(chunk));
            process.stdin.on("end", () => {
              const payload = JSON.parse(Buffer.concat(chunks).toString());
              if (!payload.success || !payload.result?.subdomain) process.exit(1);
              process.stdout.write(payload.result.subdomain);
            });
          ' <<< "${response}")"
          echo "CF_PREVIEW_DOMAIN=${preview_domain}" >> "${GITHUB_ENV}"
          PREVIEW_DOMAIN="${preview_domain}" node -e '
            const fs = require("node:fs");
            const configPath = "apps/web/wrangler.toml";
            const config = fs.readFileSync(configPath, "utf8");
            const updated = config.replace("__CF_PREVIEW_DOMAIN__", process.env.PREVIEW_DOMAIN);
            if (updated === config) throw new Error("Preview-domain placeholder was not found");
            fs.writeFileSync(configPath, updated);
          '

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CF_WORKER_NAME: yjab-web
          CF_WORKERS_SCRIPTS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
