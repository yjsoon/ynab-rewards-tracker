<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E23636"/>
      <stop offset="1" stop-color="#C42121"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background: brand crimson with a quiet diagonal ramp -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g stroke="#FFF6F2" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stem + bowl of the R -->
    <path fill="none" d="M 150 380 L 150 136 L 236 136 C 296 136 326 166 326 204 C 326 242 296 272 236 272 L 150 272"/>
    <!-- Leg: dips to the baseline, then rebounds up-right as a trend line -->
    <path fill="none" d="M 204 272 L 300 380 L 344 336"/>
    <!-- Solid arrowhead capping the rebound -->
    <path fill="#FFF6F2" stroke="none" d="M 400 280 L 383 359 L 321 297 Z"/>
  </g>
</svg>
