<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed brand crimson -->
  <rect width="512" height="512" fill="#D92D2D"/>

  <!-- Card: straight-on, perfectly level, centred -->
  <rect x="96" y="208" width="320" height="200" rx="30" fill="#FFFFFF"/>

  <!-- Stripe-as-progress: faint unfilled track -->
  <rect x="124" y="248" width="264" height="44" rx="22" fill="#F4DBDB"/>

  <!-- Stripe-as-progress: ~67% filled, rounded terminal, warm gold -->
  <rect x="124" y="248" width="178" height="44" rx="22" fill="#F5B942"/>

  <!-- Chip knockout in background crimson (card identity) -->
  <rect x="124" y="330" width="58" height="44" rx="10" fill="#D92D2D"/>

  <!-- Four-point reward spark, gold, floating above the card's top-right corner -->
  <path d="M 392 104
           C 398 136 410 144 440 150
           C 410 156 398 164 392 196
           C 386 164 374 156 344 150
           C 374 144 386 136 392 104 Z"
        fill="#F5B942"/>
</svg>
