<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D92D2D"/>
      <stop offset="1" stop-color="#FF6A45"/>
    </linearGradient>
  </defs>

  <!-- crimson field -->
  <rect width="512" height="512" fill="#D92D2D"/>

  <!-- card back, premium charcoal -->
  <rect x="88" y="164" width="320" height="212" rx="30" fill="#1D1B20"/>

  <!-- stripe track (unfilled remainder) -->
  <rect x="112" y="204" width="272" height="48" rx="24" fill="#FFFFFF" opacity="0.14"/>

  <!-- faux glow around filled stripe -->
  <rect x="102" y="194" width="212" height="68" rx="34" fill="#FF6A45" opacity="0.20"/>

  <!-- stripe as progress bar, ~70% filled -->
  <rect x="112" y="204" width="192" height="48" rx="24" fill="url(#ember)"/>

  <!-- signature-panel whisper -->
  <rect x="112" y="294" width="176" height="34" rx="10" fill="#FFFFFF" opacity="0.08"/>

  <!-- gold four-point spark floating off the top-right corner -->
  <path d="M398 104 Q398 148 442 148 Q398 148 398 192 Q398 148 354 148 Q398 148 398 104 Z" fill="#F5B942"/>
</svg>
