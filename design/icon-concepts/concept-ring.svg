<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="380" y1="132" x2="132" y2="380">
      <stop offset="0" stop-color="#d92d2d"/>
      <stop offset="1" stop-color="#ff6a45"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background -->
  <rect width="512" height="512" fill="#141417"/>
  <!-- track ring -->
  <circle cx="256" cy="256" r="136" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="58"/>
  <!-- faux glow under the arc -->
  <path d="M 256 120 A 136 136 0 1 1 120 256" fill="none" stroke="#d92d2d" stroke-opacity="0.22" stroke-width="74" stroke-linecap="round"/>
  <!-- hero progress arc: 75%, 12 o'clock to 9 o'clock -->
  <path d="M 256 120 A 136 136 0 1 1 120 256" fill="none" stroke="url(#arc)" stroke-width="58" stroke-linecap="round"/>
  <!-- nucleus -->
  <circle cx="256" cy="256" r="40" fill="#d92d2d"/>
</svg>
